name: Deploy Notara Frontend
on:
  push:
    branches: [deploy]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 30 
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a ECR
        run: |
          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin \
            495450559805.dkr.ecr.us-east-1.amazonaws.com

      - name: Build y Push bff
        run: |
          docker build -t 495450559805.dkr.ecr.us-east-1.amazonaws.com/notara-bff:latest ./bff
          docker push 495450559805.dkr.ecr.us-east-1.amazonaws.com/notara-bff:latest

      - name: Build y Push frontend-pagina
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://${{ secrets.FRONTEND_PUBLIC_IP }}:8080 \
            -t 495450559805.dkr.ecr.us-east-1.amazonaws.com/notara-frontend:latest \
            ./frontend-pagina
          docker push 495450559805.dkr.ecr.us-east-1.amazonaws.com/notara-frontend:latest

      - name: Deploy en EC2 Web via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_FRONTEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --region us-east-1 \
            --parameters commands='[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 495450559805.dkr.ecr.us-east-1.amazonaws.com",
              "if [ ! -d /home/ec2-user/notara-frontend ]; then git clone https://github.com/elpanxo/notara-frontend.git /home/ec2-user/notara-frontend; else cd /home/ec2-user/notara-frontend && git pull; fi",
              "cd /home/ec2-user/notara-frontend",
              "echo BACKEND_EC2_IP=${{ secrets.BACKEND_EC2_IP }} > .env",
              "echo FRONTEND_PUBLIC_IP=${{ secrets.FRONTEND_PUBLIC_IP }} >> .env",
              "docker compose down || true",
              "docker compose up -d --pull always"
            ]'

      - name: Verificar estado
        run: |
          sleep 20
          aws ssm list-command-invocations \
            --instance-id "${{ secrets.EC2_FRONTEND_INSTANCE_ID }}" \
            --details \
            --region us-east-1 \
            --query "CommandInvocations[0].CommandPlugins[0].{Status:Status,Output:Output}" \
            --output table


