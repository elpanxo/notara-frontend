# docker-compose.yml (repo-frontend)
version: '3.9'

services:
  bff:
    build: ./bff
    container_name: notara-bff
    ports: ["8080:8080"]
    environment:
      - SERVER_PORT=8080
      - MS_NOTAS_METAS_URL=http://${BACKEND_EC2_IP}:8083
      - MS_USUARIOS_URL=http://${BACKEND_EC2_IP}:8081
      - EUREKA_URL=http://${BACKEND_EC2_IP}:8761/eureka
    networks:
      - notara-internal
    restart: unless-stopped

  frontend-pagina:
    build:
      context: ./frontend-pagina
      args:
        NEXT_PUBLIC_API_URL: http://${FRONTEND_PUBLIC_IP}:8080
    container_name: notara-frontend
    ports: ["3001:3001"]
    depends_on: [bff]
    environment:
      - NODE_ENV=production
    networks:
      - notara-internal
    restart: unless-stopped

# Sin volumes aquí (solo front, no persiste datos)

networks:
  notara-internal:
    driver: bridge
